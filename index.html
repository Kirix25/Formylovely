<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Для моей любимой ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            text-align: center;
            color: white;
        }

        .container {
            padding: 100px 20px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 22px;
            max-width: 600px;
            margin: 20px auto;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff4f81;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ты — моё счастье ❤️</h1>
    <p>
        Спасибо тебе за каждый день, за улыбку и тепло.
        Я очень тебя люблю.
    </p>
    <button onclick="showMessage()">Нажми 💌</button>
</div>

<script>
function showMessage() {
    alert("Ты самая лучшая ❤️");
}
</script>

</body>
</html>
