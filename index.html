<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Здесь наша история ❤️</title>

<!-- Красивый шрифт -->
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

/* Заголовок */
.title {
    font-family: 'Marck Script', cursive;
    font-size: 36px;
    margin-top: 20px;
}

/* Главная фото */
.main-photo {
    width: 90%;
    max-width: 350px;
    border-radius: 20px;
    margin: 20px auto;
    display: block;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* Маленькие фото сеткой */
.small-photos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 15px;
}

.small-photos img {
    width: 100%;
    border-radius: 12px;
}

/* Кнопки */
button {
    width: 90%;
    max-width: 320px;
    padding: 14px;
    margin: 8px auto;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    background: white;
    color: #ff4f81;
    display: block;
    transition: 0.3s;
}

button:active {
    transform: scale(0.95);
}

/* Попап */
.popup {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    color: #ff4f81;
    padding: 25px;
    border-radius: 25px 25px 0 0;
    display: none;
}

.popup img {
    width: 100%;
    border-radius: 15px;
}

.close {
    margin-top: 15px;
    color: gray;
    font-size: 14px;
    cursor: pointer;
}

/* Плавающие сердечки */
.heart {
    position: fixed;
    bottom: -10px;
    font-size: 20px;
    animation: floatUp 5s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
}

/* Секретная кнопка */
.secret-btn {
    margin-top: 15px;
    font-size: 12px;
    background: transparent;
    color: rgba(255,255,255,0.5);
}

</style>
</head>

<body>

<h1 class="title">Здесь наша история 💖</h1>

<img src="main-photo.jpg" class="main-photo">

<button onclick="showTimer()">❤️ Таймер</button>
<button onclick="showWish()">🌸 Пожелание на день</button>
<button onclick="showMoment()">📸 Моменты</button>

<div class="small-photos">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.JPG">
    <img src="photo5.JPG">
</div>

<button class="secret-btn" onclick="secretSurprise()">...</button>

<div id="popup" class="popup">
    <div id="popupContent"></div>
    <div class="close" onclick="closePopup()">Закрыть</div>
</div>

<script>

// ДАТА НАЧАЛА
const startDate = new Date("10-08-2025");

const wishes = [
    "Ты моё самое большое счастье ❤️",
    "Пусть твой день будет волшебным ✨",
    "Я горжусь тобой каждый день 💕"
];

const moments = [
    { src: "moment1.jpg", text: "Тот самый переломный момент 💕" },
    { src: "moment2.jpg", text: "Тот момент, когда дни стали идти дольше..." }
];

// Таймер
function showTimer() {
    const today = new Date();
    const diffTime = today - startDate;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
    openPopup("<h2>Мы вместе уже " + diffDays + " дней ❤️</h2>");
}

// Пожелание
function showWish() {
    const random = wishes[Math.floor(Math.random() * wishes.length)];
    openPopup("<h3>" + random + "</h3>");
}

// Момент
function showMoment() {
    const randomMoment = moments[Math.floor(Math.random() * moments.length)];
    openPopup("<img src='" + randomMoment.src + "'><p>" + randomMoment.text + "</p>");
}

// Попап
function openPopup(content) {
    document.getElementById("popupContent").innerHTML = content;
    document.getElementById("popup").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

// Секретная кнопка
function secretSurprise() {
    openPopup("<h2>Ты — лучшее, что случилось в моей жизни 💖</h2>");
}

// Плавающие сердечки
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}, 500);

</script>

</body>
</html>
